<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Memory</title>
</head>
<body>
    <div class="navbar">
        <div class="navbar-menu">
            <a href="index.html">Memory</a>
            <a id="login-link" href="login.html">Login</a>
            <a id="logout-link" href="#">Logout</a>
        </div>
    </div>
    <div class="game">
        <div class="gameInfo">
            <p>Beurten: <span id="turnCounterSpan">0</span></p>
            <p>Gevonden paren <span id="pairCounterSpan">0</span>/<span id="totalPairSpan">18</span></p>
            <p>Time spent:<br><span id="timerDisplay">0</span> seconds</p>
        </div>
        <div class="memory" id="memoryBoard"></div>
    </div>
    <div class="sidebar">
        <div class="highscores" id="HighScores">
        </div>
        <div class="newGameForm">
            <h3>Card Type</h3>
            <form onsubmit="submitForm(event)">
                <div class="cardTypeInput">
                    <div class="cardSelectInputOption">
                        <label for="letters">
                            Letters
                            <input type="radio" name="cardTypeSelect" id="letters" value="letters">
                        </label><br>
                    </div>
                    <div class="cardSelectInputOption">
                        <label for="dogs">
                            Dogs
                            <input type="radio" name="cardTypeSelect" id="dogs" value="dogs">
                        </label><br>
                    </div>
                    <div class="cardSelectInputOption">
                        <label for="cats">
                            Cats
                            <input type="radio" name="cardTypeSelect" id="cats" value="cats">
                        </label><br>
                    </div>
                    <div class="cardSelectInputOption">
                        <label for="random">
                            Random
                            <input type="radio" name="cardTypeSelect" id="random" value="picsum">
                        </label><br>
                    </div>
                </div>
                <br>
                <h3>Board Size</h3>
                <div class="boardSizeInput">
                    <div class="boardSizeInputOption">
                        <label for="4">
                            4
                            <input type="radio" name="boardSizeSelect" id="4" value="4">
                        </label><br>
                        
                    </div>
                    <div class="boardSizeInputOption">
                        <label for="5">
                            5
                            <input type="radio" name="boardSizeSelect" id="5" value="5">
                        </label><br>
                    
                    </div>
                    <div class="boardSizeInputOption">
                        <label for="6">
                            6
                            <input type="radio" name="boardSizeSelect" id="6" value="6">
                        </label><br>
                        
                    </div>
                </div>

                <h3>Shuffle</h3>
                <div class="shuffleMenu">
                    <div class="shuffleInputOption">
                        <label for="noShuffle">
                            None
                            <input type="radio" name="shuffleRadio" id="noShuffle" value="none">
                        </label><br>
                    </div>
                    <div class="shuffleInputOption">
                        <label for="noShuffle">
                            Easy
                            <input type="radio" name="shuffleRadio" id="easyShuffle" value="2">
                        </label><br>
                    </div>
                   <div class="shuffleInputOption">
                        <label for="noShuffle">
                            Medium
                            <input type="radio" name="shuffleRadio" id="MediumSuffle" value="1.5">
                        </label><br>
                    </div>
                   <div class="shuffleInputOption">
                        <label for="noShuffle">
                            Hard
                            <input type="radio" name="shuffleRadio" id="HardShuffle" value="1">
                        </label><br>
                    </div>
                </div>
                
                <br>
                <label for="OpenCardColor">
                    
                    <input type="color" name="openCardColor" id="OpenCardColor" value="hsl(216.6 26.1% 69.2%)">
                    openCardColor
                </label><br>
                <label for="ClosedCardColor">
                    <input type="color" name="closedCardColor" id="ClosedCardColor" value="hsl(216 17% 28.8%)">
                    closedCardColor
                </label><br>
                <label for="FoundCardColor">
                    <input type="color" name="foundCardColor" id="FoundCardColor" value="hsl(215.4 15.8% 48.4%)">
                    foundCardColor
                </label>
                
                
                
                <br>
                <br>
                <input type="submit" value="New Game">

            </form>
        </div>
    </div>

    <div id="gameWonModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>🎉 Victory! 🎉</h2>
        <p>Incredible job! You cleared the board with <span id="scoreSpan"></span> points!</p>
        <button id="closeBtn">Close</button>
    </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
