<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Memory</title>
</head>
<body>
    <div class="navbar">
        <div class="logo-image">
            <img src="logo.png" alt="">
        </div>
        <div class="navbar-menu">
            <div class="nav-menu-login">
                <a id="login-link" href="login.html">Inloggen</a>
                <a id="logout-link" href="#">Uitloggen</a>
            </div>

        </div>
    </div>
    <div class="game">
        <div class="gameInfo">
            <p>Beurten: <span id="turnCounterSpan">0</span></p>
            <p>Gevonden paren <span id="pairCounterSpan">0</span>/<span id="totalPairSpan">18</span></p>
            <p>Tijd verlopen:<br><span id="timerDisplay">0</span> seconden</p>
        </div>
        <div class="memory" id="memoryBoard"></div>
    </div>
    <div class="sidebar">
        <div class="highscores" id="HighScores">
        </div>
        <div class="newGameDiv">
            <h3>Kaartsoort</h3>
            <form class="newGameForm" id="newGameForm">
                <div class="cardTypeInput">
                    <div class="radioInputOption">
                        <label for="letters">
                            Letters
                            <input type="radio" name="cardTypeSelect" id="letters" value="letters">
                        </label><br>
                    </div>
                    <div class="radioInputOption">
                        <label for="dogs">
                            Honden
                            <input type="radio" name="cardTypeSelect" id="dogs" value="dogs">
                        </label><br>
                    </div>
                    <div class="radioInputOption">
                        <label for="cats">
                            Katten
                            <input type="radio" name="cardTypeSelect" id="cats" value="cats">
                        </label><br>
                    </div>
                    <div class="radioInputOption">
                        <label for="random">
                            Lorem Picsum
                            <input type="radio" name="cardTypeSelect" id="random" value="picsum">
                        </label>
                    </div>
                </div>
                <h3>Afmetingen bord</h3>
                <div class="boardSizeInput">
                    <div class="radioInputOption">
                        <label for="4">
                            4
                            <input type="radio" name="boardSizeSelect" id="4" value="4">
                        </label><br>
                        
                    </div>
                    <div class="radioInputOption">
                        <label for="5">
                            5
                            <input type="radio" name="boardSizeSelect" id="5" value="5">
                        </label><br>
                    
                    </div>
                    <div class="radioInputOption">
                        <label for="6">
                            6
                            <input type="radio" name="boardSizeSelect" id="6" value="6">
                        </label>
                        
                    </div>
                </div>
                <h3>Shufflemodus</h3>
                <div class="shuffleMenu">
                    <div class="radioInputOption">
                        <label for="noShuffle">
                            Geen
                            <input type="radio" name="shuffleRadio" id="noShuffle" value="none">
                        </label>
                    </div>
                    <div class="radioInputOption">
                        <label for="easyShuffle">
                            Makkelijk
                            <input type="radio" name="shuffleRadio" id="easyShuffle" value="2">
                        </label>
                    </div>
                   <div class="radioInputOption">
                        <label for="MediumSuffle">
                            Normaal
                            <input type="radio" name="shuffleRadio" id="MediumSuffle" value="1.5">
                        </label>
                    </div>
                   <div class="radioInputOption">
                        <label for="HardShuffle">
                            Moeilijk
                            <input type="radio" name="shuffleRadio" id="HardShuffle" value="1">
                        </label>
                    </div>
                </div>
                <div class="colorSelect">
                    <div class="colorInputOption">
                        <h3>Kaartkleur open</h3>
                        <label for="OpenCardColor">
                            <input type="color" name="openCardColor" id="OpenCardColor" value="#a4b6cb">
                        </label>
                    </div>
                     <div class="colorInputOption">
                        <h3>Kaartkleur gesloten</h3>
                    <label for="ClosedCardColor">
                        <input type="color" name="closedCardColor" id="ClosedCardColor" value="#3d4756">
                        
                    </label>
                     </div>
                    <div class="colorInputOption">
                        <h3>Kaartkleur gevonden</h3>
                        <label for="FoundCardColor">
                            <input type="color" name="foundCardColor" id="FoundCardColor" value="#64748b">
                        </label>
                    </div>
                </div>

                <input type="submit" value="Nieuw spel" id="newGameFormButton">

            </form>
        </div>
    </div>

    <div id="gameWonModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>🎉 Gefeliciteerd! 🎉</h2>
        <p>Goed gedaan! Je hebt alle paren gevonden met <span id="scoreSpan"></span> punten!</p>
        <button id="closeBtn">Sluiten</button>
    </div>
</div>
<script src="main.js" type="module"></script>
<script src="memory.js" type="module"></script>

</body>
</html>
