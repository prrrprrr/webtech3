<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>

    body {
        display: grid;
        grid-template-rows: 120px 1fr 1fr;
        grid-template-columns: 1fr 1fr;
        grid-template-areas: "navbar navbar" "loginform registerform";
        margin: 0;
        background-color: hsl(214.3 25.9% 94.7%);;
        gap: 10px;
    }
    .navbar {
        background-color: hsl(215.4 15.8% 48.4%);
        height: 120px;
        grid-area: navbar;
    }

    .loginform {
        display: grid;
        grid-template-rows: 100px 1fr 100px;
        grid-template-areas: "login" "invoerveld";
        background-color: hsl(215.4 15.8% 48.4%);
        place-items: center;
        grid-area: loginform;
        aspect-ratio: 1/1;
        border-radius: 12px;
        margin: 30px;
    } 
    .invoerveld {
        grid-area: invoerveld;
        input {
            margin-top: 10px;
            width: minmax(100px, 300px);
        }
    }
    .registerform {
        display: grid;
        grid-template-rows: 100px 1fr 100px;
        grid-template-areas: "login" "invoerveld";
        background-color: hsl(215.4 15.8% 48.4%);
        place-items: center;
        grid-area: registerform;
        aspect-ratio: 1/1;
        border-radius: 12px;
        margin: 30px;
    } 
    @media (min-width: 768px) {
    body{
        display: grid;
        grid-template-rows: 120px minmax(400px,1fr) 1fr;
        grid-template-columns: 1fr minmax(300px, 1fr) minmax(300px, 1fr) 1fr;
        grid-template-areas: "navbar navbar navbar navbar" ". loginform registerform .";
    }
}
</style>
</head>
<body>
    <div class="navbar">
        <a href="memory.html">Memory</a>
        <a href="login.html">login</a>
    </div>
    <div class="loginform">
        <h1>Login</h1>
        <form onsubmit="attemptLogin(event)">
            <div class="invoerveld">
                <label for="gebruikersnaam">
                    Gebruikersnaam
                    <br>
                    <input type="text" name="gebruikersnaam" value="gebruikersnaam">
                </label>
            </div>
            <br>
            <div class="invoerveld">
                <label for="wachtwoord">
                    Wachtwoord
                    <br>
                    <input type="text" name="wachtwoord" value="wachtwoord">
                </label>
            </div>
            <br>
            <br>
            <input type="submit" value="Inloggen">
        </form>
    </div>
    <div class="registerform">
        <h1>Register</h1>
        <form onsubmit="attemptRegister(event)">
            <div class="invoerveld">
                <label for="gebruikersnaam">
                    Gebruikersnaam
                    <br>
                <input type="text" name="gebruikersnaam" value="gebruikersnaam">
                </label>
            </div>
            <br>
            <div class="invoerveld">
                <label for="wachtwoord">
                    Wachtwoord
                    <br>
                    <input type="text" name="wachtwoord" value="wachtwoord">
                </label>
            </div>
                        <br>
            <br>
            <input type="submit" value="Registreer">
        </form>
    </div>
<script src="scripts.js"></script>
</body>
</html>
